# =============================================================================
# PNPM WORKSPACE CONFIGURATION
# =============================================================================
# Centralized workspace governance for:
# - dependency management
# - tooling consistency
# - supply-chain security
# - monorepo orchestration
# - platform runtime standardization
# =============================================================================

# -----------------------------------------------------------------------------
# WORKSPACE PACKAGES
# -----------------------------------------------------------------------------
packages:
  # Core platform packages
  - 'packages/*'

  # Generators / scaffolding
  - 'packages/generators/*'

# -----------------------------------------------------------------------------
# SHARED DEPENDENCY CATALOG
# -----------------------------------------------------------------------------
# Centralized reusable dependency versions.
#
# Usage:
#
#   "dependency": "catalog:"
#
# Benefits:
# - prevents dependency drift
# - simplifies upgrades
# - standardizes tooling
# - improves governance
# -----------------------------------------------------------------------------
catalog:
  # ===========================================================================
  # RELEASE / VERSIONING
  # ===========================================================================

  '@changesets/cli': 2.31.0

  # ===========================================================================
  # SOURCE CONTROL / COMMITS
  # ===========================================================================

  '@commitlint/cli': 21.0.1
  '@commitlint/config-conventional': 21.0.1

  # ===========================================================================
  # TYPESCRIPT / NODE RUNTIME
  # ===========================================================================

  '@types/node': 24.12.4

  # ===========================================================================
  # LINTING / STATIC ANALYSIS
  # ===========================================================================
  '@typescript-eslint/parser': 8.59.4

  '@vitest/coverage-v8': 4.1.7

  # ===========================================================================
  # VSCODE / EXTENSION DEVELOPMENT
  # ===========================================================================

  '@vscode/test-electron': 2.5.2
  cac: 6.7.14
  # ===========================================================================
  # ARCHITECTURE / DEPENDENCY GOVERNANCE
  # ===========================================================================

  dependency-cruiser: 17.4.0

  esbuild-visualizer: 0.7.0

  eslint: 9.39.1
  eslint-config-prettier: 10.1.8

  eslint-import-resolver-node: 0.4.0

  eslint-import-resolver-typescript: 4.4.4

  eslint-plugin-import: 2.32.0

  # ===========================================================================
  # INTERNAL TOOLING / RUNTIME
  # ===========================================================================

  execa: 9.6.1

  husky: 9.1.7
  prettier: 3.8.3
  # ===========================================================================
  # UTILITIES
  # ===========================================================================

  rimraf: 6.1.3

  syncpack: 15.3.1

  tsup: 8.5.1
  tsx: 4.22.0

  # ===========================================================================
  # BUILD / TASK ORCHESTRATION
  # ===========================================================================

  turbo: 2.9.14

  typescript: 5.9.3
  typescript-eslint: 8.59.4

  # ===========================================================================
  # TESTING
  # ===========================================================================

  vitest: 4.1.7

  zod: 4.4.3
  depcheck: 1.4.7
  lint-staged: 16.4.0
# Fail installation if Node version does not match.
engineStrict: true
minimumReleaseAge: 4320
# Future applications
# - "apps/*"

# Future platform tooling
# - "tooling/*"

# -----------------------------------------------------------------------------
# NODE / RUNTIME GOVERNANCE
# -----------------------------------------------------------------------------

# Enforce consistent Node.js runtime across the workspace.
nodeVersion: 24.12.4

# -----------------------------------------------------------------------------
# SUPPLY CHAIN / NATIVE BUILD GOVERNANCE
# -----------------------------------------------------------------------------
# Only allow trusted packages to execute install/build scripts.
#
# Helps protect against:
# - malicious postinstall scripts
# - unexpected native builds
# - supply-chain attacks
# -----------------------------------------------------------------------------
onlyBuiltDependencies:
  # Native bundler runtime

  # Native SWC compiler
  - '@swc/core'
  - '@unrs/resolver-binding-win32-x64-msvc'

  # VSCode extension signing
  - '@vscode/vsce-sign'
  - esbuild

  # Secure OS credential access
  - keytar

  # Fast Rust-based module resolver
  - unrs-resolver

# -----------------------------------------------------------------------------
# GLOBAL VERSION OVERRIDES
# -----------------------------------------------------------------------------
# Force consistent dependency versions across the entire workspace.
#
# Useful for:
# - security patches
# - dependency deduplication
# - runtime consistency
# - tooling standardization
# -----------------------------------------------------------------------------
overrides:
  lodash: ^4.17.24

  tmp: ^0.2.4

# -----------------------------------------------------------------------------
# PEER DEPENDENCY RULES
# -----------------------------------------------------------------------------
peerDependencyRules:
  # Ignore peer dependency warnings intentionally managed at root.
  ignoreMissing:
    - eslint

    - typescript

# -----------------------------------------------------------------------------
# HOISTING STRATEGY
# -----------------------------------------------------------------------------
# Improve compatibility for tooling ecosystems that expect hoisted deps.
# -----------------------------------------------------------------------------
publicHoistPattern:
  - '*eslint*'
  - '*typescript*'
  - '*vitest*'

# Automatically use workspace:* protocol for internal packages.
saveWorkspaceProtocol: rolling

# -----------------------------------------------------------------------------
# SUPPORTED RUNTIME ARCHITECTURES
# -----------------------------------------------------------------------------
supportedArchitectures:
  cpu:
    - x64
  os:
    - win32
    - linux
